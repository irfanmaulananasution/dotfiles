apiVersion: v1
kind: Service
metadata:
  name: litellm
  namespace: llm-stack
spec:
  ports:
    - port: 4000
  selector:
    app: litellm
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
  namespace: llm-stack
spec:
  replicas: 1
  selector:
    matchLabels:
      app: litellm
  template:
    metadata:
      labels:
        app: litellm
    spec:
      containers:
        - name: litellm
          image: ghcr.io/irfan-macee/llm-stack/litellm:latest
          ports:
            - containerPort: 4000
          env:
            - name: LITELLM_KEY
              valueFrom:
                secretKeyRef:
                  name: llm-stack-secrets
                  key: litellm-key
            - name: PERSONAL_OPENCODE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: llm-stack-secrets
                  key: personal-opencode-api-key
            - name: PERSONAL_DEEPSEEK_API_KEY
              valueFrom:
                secretKeyRef:
                  name: llm-stack-secrets
                  key: personal-deepseek-api-key
            - name: OTEL_ENDPOINT
              value: http://phoenix:4317
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - 'curl -sf -H "Authorization: Bearer $LITELLM_KEY" http://localhost:4000/health || exit 1'
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - 'curl -sf -H "Authorization: Bearer $LITELLM_KEY" http://localhost:4000/health || exit 1'
            initialDelaySeconds: 30
            periodSeconds: 30
