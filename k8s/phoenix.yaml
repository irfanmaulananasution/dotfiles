apiVersion: v1
kind: Service
metadata:
  name: phoenix
  namespace: llm-stack
spec:
  ports:
    - name: http
      port: 6006
      targetPort: 6006
    - name: grpc
      port: 4317
      targetPort: 4317
  selector:
    app: phoenix
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: phoenix
  namespace: llm-stack
spec:
  replicas: 1
  selector:
    matchLabels:
      app: phoenix
  template:
    metadata:
      labels:
        app: phoenix
    spec:
      containers:
        - name: phoenix
          image: ghcr.io/irfan-macee/llm-stack/phoenix:latest
          ports:
            - containerPort: 6006
            - containerPort: 4317
          env:
            # Must come first — Kubernetes only expands $(VAR) references
            # from env vars defined earlier in this list.
            - name: PHOENIX_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: llm-stack-secrets
                  key: phoenix-db-password
            - name: PHOENIX_SQL_DATABASE_URL
              value: postgresql+asyncpg://phoenix:$(PHOENIX_DB_PASSWORD)@postgres:5432/phoenix
            - name: PHOENIX_PORT
              value: "6006"
            - name: PHOENIX_GRPC_PORT
              value: "4317"
            - name: PHOENIX_OTLP_PORT
              value: "4317"
          readinessProbe:
            httpGet:
              path: /
              port: 6006
            initialDelaySeconds: 15
            periodSeconds: 10
