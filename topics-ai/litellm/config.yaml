# =============================================================================
#  LiteLLM Proxy — model configuration
# =============================================================================
#  NAMING CONVENTION: model_name = <real_upstream_model_name>-<provider>
#    e.g. deepseek-v4-pro-opencodego → DeepSeek V4 Pro via OpenCodeGO
#         deepseek-v4-pro-deepseek → DeepSeek V4 Pro via official DeepSeek API
#
#  One entry per model. Providers are separated into clearly marked sections.
#
#  PROVIDERS:
#    - opencodego → https://opencode.ai/zen/go/v1 (PERSONAL_OPENCODE_API_KEY)
#    - deepseek → https://api.deepseek.com     (PERSONAL_DEEPSEEK_API_KEY)
#
#  NOTE: LiteLLM OTel spans record the UPSTREAM model name (e.g. deepseek-v4-pro),
#        so pricing in scripts/enrich_spans.py and Phoenix generative_models
#        name_patterns are keyed on the real model name, not these route names.
# =============================================================================

model_list:

  # =========================================================================
